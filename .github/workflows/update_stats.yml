name: Update Profile Stats

on:
  schedule:
    - cron: '0 * * * *' # Runs automatically every hour (Free on public repos)
  workflow_dispatch:     # Allows manual 1-click trigger
  repository_dispatch:   # Allows triggering remotely from any other repo on push
    types: [update_stats]
  push:
    branches:
      - main
    paths:
      - 'generate_card.py'
      - 'logo512.png'

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pillow numpy

      - name: Generate Terminal Card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_card.py

      - name: Commit & Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add card_v2.png
          if git diff --staged --quiet; then
            echo "No stats changes to commit."
          else
            git commit -m "chore: auto-update terminal stats [skip ci]"
            git push
          fi
